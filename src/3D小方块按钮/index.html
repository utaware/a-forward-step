<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D小方块按钮</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
    <style>
      /* 基础代码 */
      * {
        margin: 0;
        padding: 0;
      }

      html {
        font-family: 'Noto Sans SC', sans-serif;
        color: #f0f0f0;
      }

      body {
        min-height: 100vh;
        background-color: #ccc;
        align-content: center;
        perspective: 1000px;
      }

      ul {
        display: flex;
        justify-content: center;
        gap: 4rem;
      }

      ul li {
        list-style: none;
      }

      ul li a {
        position: relative;
        display: flex;
        padding: 0.75rem 1.5rem;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        gap: 1rem;
        color: #333;
        transition: 0.5s;
        background-color: #fff;
        transform: rotate(-30deg) skewX(25deg);
        box-shadow: -2rem 2rem 1rem rgba(0,0,0,0.5);
      }

      ul li:hover a {
        background-color: #dd4b39;
        transform: rotate(-30deg) skewX(25deg) translate(1rem, 1rem);
      }

      ul li a::before, ul li a::after {
        position: absolute;
        content: '';
        background-color: #b1b1b1;
        transition: 0.5s;
      }

      ul li:hover a::before {
        background-color: #b33a2b;
      }
      ul li:hover a::after {
        background-color: #e66a5a;
      }

      ul li a::before {
        width: 1rem;
        height: 100%;
        left: -1rem;
        transform: skewY(-45deg);
        transform-origin: right;
      }
      ul li a::after {
        width: 100%;
        height: 1rem;
        left: -0.5rem;
        bottom: -1rem;
        transform: skewX(-45deg);
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <a href="#">
          <i class="fa fa-google" aria-hidden="true"></i>
          <span>Google</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="fa fa-github" aria-hidden="true"></i>
          <span>Github</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="fa fa-chrome" aria-hidden="true"></i>
          <span>Chrome</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="fa fa-facebook" aria-hidden="true"></i>
          <span>Facebook</span>
        </a>
      </li>
    </ul>
  </body>
</html>
