<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge TTS 调试台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <header class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 border-bottom border-2 border-dark pb-3 mb-4">
        <h1 class="mb-0">Edge TTS 调试台</h1>
        <p id="status" class="small text-secondary text-md-end mb-0" role="status">就绪</p>
      </header>

      <form id="tts-form" class="row g-4 align-items-start">
        <section class="col-12 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
                <label class="form-label small fw-bold text-uppercase mb-0" for="text">合成文本</label>
                <span id="count" class="small text-secondary">0 / 3000</span>
              </div>
              <textarea class="form-control" id="text" name="text" maxlength="3000" required>你好，这是 Edge TTS 调试页面。</textarea>
            </div>
          </div>
        </section>

        <aside class="col-12 col-lg-4 d-grid gap-4">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <tts-select-field label="音色" input-id="voice" name="voice">
                <option value="zh-CN-XiaoxiaoNeural" data-lang="zh-CN">晓晓 · 中文女声</option>
                <option value="zh-CN-YunxiNeural" data-lang="zh-CN">云希 · 中文男声</option>
                <option value="zh-CN-YunjianNeural" data-lang="zh-CN">云健 · 中文男声</option>
                <option value="zh-TW-HsiaoChenNeural" data-lang="zh-TW">曉臻 · 繁体女声</option>
                <option value="en-US-AriaNeural" data-lang="en-US">Aria · English</option>
                <option value="en-US-GuyNeural" data-lang="en-US">Guy · English</option>
                <option value="ja-JP-NanamiNeural" data-lang="ja-JP">Nanami · 日本語</option>
              </tts-select-field>

              <input id="lang" name="lang" type="hidden" value="zh-CN" />

              <tts-select-field label="输出音质" input-id="outputFormat" name="outputFormat">
                <option value="audio-16khz-32kbitrate-mono-mp3">16 kHz · 32 kbps</option>
                <option value="audio-24khz-48kbitrate-mono-mp3" selected>24 kHz · 48 kbps</option>
                <option value="audio-24khz-96kbitrate-mono-mp3">24 kHz · 96 kbps</option>
              </tts-select-field>

              <tts-range-field label="语速" input-id="rate" name="rate" min="-100" max="100" value="0" percent></tts-range-field>
              <tts-range-field label="音调" input-id="pitch" name="pitch" min="-100" max="100" value="0" percent></tts-range-field>
              <tts-range-field label="音量" input-id="volume" name="volume" min="-100" max="100" value="0" percent></tts-range-field>
              <tts-range-field label="超时时间" input-id="timeout" name="timeout" min="3" max="60" step="1" value="15"></tts-range-field>

              <button class="btn btn-primary w-100 py-2 fw-bold" id="submit" type="submit">生成语音</button>
            </div>
          </section>

          <section id="player" class="card shadow-sm" hidden>
            <div class="card-body p-4">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <span class="small fw-bold text-uppercase">生成结果</span>
                <a id="download" class="btn btn-sm btn-outline-success" download="edge-tts.mp3">下载</a>
              </div>
              <audio class="w-100 d-block" id="audio" controls preload="metadata"></audio>
            </div>
          </section>
        </aside>
      </form>
    </main>

    <script src="/js/components.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
