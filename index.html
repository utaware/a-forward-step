<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge TTS 调试台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --ink: #17201f;
        --paper: #f4f6f1;
      }

      body {
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(rgba(33, 109, 91, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(33, 109, 91, 0.055) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 6vw, 62px);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: 0;
      }

      #text {
        min-height: 330px;
        resize: vertical;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <header class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 border-bottom border-2 border-dark pb-3 mb-4">
        <h1 class="mb-0">Edge TTS 调试台</h1>
        <p id="status" class="small text-secondary text-md-end mb-0" role="status">就绪</p>
      </header>

      <form id="tts-form" class="row g-4 align-items-start">
        <section class="col-12 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
                <label class="form-label small fw-bold text-uppercase mb-0" for="text">合成文本</label>
                <span id="count" class="small text-secondary">0 / 3000</span>
              </div>
              <textarea class="form-control" id="text" name="text" maxlength="3000" required>你好，这是 Edge TTS 调试页面。</textarea>
            </div>
          </div>
        </section>

        <aside class="col-12 col-lg-4 d-grid gap-4">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label small fw-bold" for="voice">音色</label>
                <select class="form-select" id="voice" name="voice">
                  <option value="zh-CN-XiaoxiaoNeural" data-lang="zh-CN">晓晓 · 中文女声</option>
                  <option value="zh-CN-YunxiNeural" data-lang="zh-CN">云希 · 中文男声</option>
                  <option value="zh-CN-YunjianNeural" data-lang="zh-CN">云健 · 中文男声</option>
                  <option value="zh-TW-HsiaoChenNeural" data-lang="zh-TW">曉臻 · 繁体女声</option>
                  <option value="en-US-AriaNeural" data-lang="en-US">Aria · English</option>
                  <option value="en-US-GuyNeural" data-lang="en-US">Guy · English</option>
                  <option value="ja-JP-NanamiNeural" data-lang="ja-JP">Nanami · 日本語</option>
                </select>
              </div>

              <input id="lang" name="lang" type="hidden" value="zh-CN" />

              <div class="mb-3">
                <label class="form-label small fw-bold" for="outputFormat">输出音质</label>
                <select class="form-select" id="outputFormat" name="outputFormat">
                  <option value="audio-16khz-32kbitrate-mono-mp3">16 kHz · 32 kbps</option>
                  <option value="audio-24khz-48kbitrate-mono-mp3" selected>24 kHz · 48 kbps</option>
                  <option value="audio-24khz-96kbitrate-mono-mp3">24 kHz · 96 kbps</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold" for="rate">语速</label>
                <div class="d-flex align-items-center gap-3">
                  <input class="form-range" id="rate" name="rate" type="range" min="-100" max="100" value="0" />
                  <output for="rate">+0%</output>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold" for="pitch">音调</label>
                <div class="d-flex align-items-center gap-3">
                  <input class="form-range" id="pitch" name="pitch" type="range" min="-100" max="100" value="0" />
                  <output for="pitch">+0%</output>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold" for="volume">音量</label>
                <div class="d-flex align-items-center gap-3">
                  <input class="form-range" id="volume" name="volume" type="range" min="-100" max="100" value="0" />
                  <output for="volume">+0%</output>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold" for="timeout">超时时间（毫秒）</label>
                <input id="timeoutRange" type="range" name="timeout" class="form-range" min="3000" max="60000" step="1000" value="15000" />
              </div>

              <button class="btn btn-primary w-100 py-2 fw-bold" id="submit" type="submit">生成语音</button>
            </div>
          </section>

          <section id="player" class="card shadow-sm" hidden>
            <div class="card-body p-4">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <span class="small fw-bold text-uppercase">生成结果</span>
                <a id="download" class="btn btn-sm btn-outline-success" download="edge-tts.mp3">下载</a>
              </div>
              <audio class="w-100 d-block" id="audio" controls preload="metadata"></audio>
            </div>
          </section>
        </aside>
      </form>
    </main>

    <script>
      const form = document.querySelector('#tts-form')
      const text = document.querySelector('#text')
      const count = document.querySelector('#count')
      const voice = document.querySelector('#voice')
      const lang = document.querySelector('#lang')
      const submit = document.querySelector('#submit')
      const status = document.querySelector('#status')
      const player = document.querySelector('#player')
      const audio = document.querySelector('#audio')
      const download = document.querySelector('#download')

      function updateCount() {
        count.textContent = `${text.value.length} / 3000`
      }

      function formatPercent(value) {
        const number = Number(value)
        return `${number >= 0 ? '+' : ''}${number}%`
      }

      document.querySelectorAll('input[type="range"]').forEach(input => {
        const output = input.parentElement.querySelector('output')
        input.addEventListener('input', () => {
          output.value = formatPercent(input.value)
        })
      })

      voice.addEventListener('change', () => {
        lang.value = voice.selectedOptions[0].dataset.lang
      })
      text.addEventListener('input', updateCount)
      updateCount()

      form.addEventListener('submit', async event => {
        event.preventDefault()
        submit.disabled = true
        player.hidden = true
        status.textContent = '正在生成…'

        const formData = new FormData(form)
        const payload = Object.fromEntries(formData.entries())
        payload.rate = formatPercent(payload.rate)
        payload.pitch = formatPercent(payload.pitch)
        payload.volume = formatPercent(payload.volume)
        payload.timeout = Number(payload.timeout)

        try {
          const response = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          })
          const result = await response.json()
          if (!response.ok) throw new Error(result.error || '语音生成失败')

          const audioUrl = `${result.audioUrl}?t=${Date.now()}`
          audio.src = audioUrl
          download.href = result.audioUrl
          player.hidden = false
          status.textContent = '生成完成'
          await audio.play().catch(() => undefined)
        } catch (error) {
          status.textContent = error.message || '语音生成失败'
        } finally {
          submit.disabled = false
        }
      })
    </script>
  </body>
</html>
